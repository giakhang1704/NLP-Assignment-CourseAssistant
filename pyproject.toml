[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-course-assistant"
version = "0.2.0"
description = "Domain CFG, Earley parser and semantic handoff for CO3085 Course Assistant"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
course-assistant = "course_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
